repos:
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-github-actions
      - id: check-github-issue-config
      - id: check-github-issue-forms
      - id: check-readthedocs
      - id: check-compose-spec

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        # actionlint has no support for GitHub's `$/` self-repository syntax
        # yet; see rhysd/actionlint#711.
        args: ["-ignore", 'specifying action "\$/']

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # frozen: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
        # tests/fixtures is asserted byte for byte; see .gitattributes
        exclude: ^tests/fixtures/
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-illegal-windows-names
      - id: check-case-conflict

  - repo: meta
    hooks:
      - id: check-useless-excludes

ci:
  autofix_prs: true
  # Dependabot updates the hooks: pre-commit.ci pins an annotated tag by its
  # tag object, not its commit. Autoupdate has no off switch, so it runs at
  # the rarest schedule.
  autoupdate_schedule: quarterly
  submodules: false
