# https://docs.codecov.com/docs/codecov-yaml
codecov:
  require_ci_to_pass: true
  notify:
    # ubuntu, macos and windows each upload a report for the same commit.
    # Wait for all three, or statuses fire on a single OS's partial coverage.
    after_n_builds: 3

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 100%
    patch:
      default:
        target: 90%

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
  after_n_builds: 3
