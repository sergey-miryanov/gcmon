name: Setup Python and Poetry
description: Checkout, setup Python, install Poetry, restore cache, and install dependencies
inputs:
  python-version:
    description: Python version
    required: true
  cache-prefix:
    description: Prefix for cache key
    required: true

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true

    - name: Install Poetry
      run: pipx install poetry
      shell: bash

    - name: Restore Poetry cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ runner.os == 'Windows' && '~\AppData\Local\pypoetry\Cache' || runner.os == 'macOS' && '~/Library/Caches/pypoetry' || '~/.cache/pypoetry' }}
        # `-lock-` closes the version, so a 3.15.0 run cannot restore a
        # 3.15.0-rc.3 cache, whose virtualenv points at a removed interpreter.
        key: poetry-cache-${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-lock-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          poetry-cache-${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-lock-

    - name: Install dependencies
      run: poetry install --all-groups --all-extras --no-interaction
      shell: bash
