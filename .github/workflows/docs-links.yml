name: Documentation links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List documentation
        run: git ls-files '*.md' > "$RUNNER_TEMP/docs-link-inputs.txt"

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Check this repository's own URLs against the checkout, so a pull
          # request is judged on its own files and not on what main holds.
          args: >-
            --files-from "$RUNNER_TEMP/docs-link-inputs.txt"
            --remap "^https://github\.com/sergey-miryanov/gcmon/blob/main/(.*) file://$GITHUB_WORKSPACE/\$1"
            --remap "^https://raw\.githubusercontent\.com/sergey-miryanov/gcmon/main/(.*) file://$GITHUB_WORKSPACE/\$1"
