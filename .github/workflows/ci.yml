name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Skip docs-only PRs. Pushes to main stay unfiltered so every commit
    # uploads coverage for Codecov to use as a PR base.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Lint with ruff
        run: |
          poetry run just lint

      # Every tracked Markdown file but `CHANGELOG.md`, which is one bullet
      # per line and stays that way. A CRLF file fails here too: the script
      # reports one rather than rewriting it.
      - name: Check the prose wrapping
        run: |
          git ls-files -z '*.md' ':!:CHANGELOG.md' \
            | xargs -0 python .github/scripts/wrap_markdown.py --check

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Type check with mypy
        run: |
          poetry run just typecheck-mypy

  pyrefly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Type check with pyrefly
        run: |
          poetry run just typecheck-pyrefly

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      # Deselected from the default run, which is why it takes a job of its own.
      - name: Check the layers
        run: |
          poetry run just architecture

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.15"]
    steps:

      - name: Configure macOS taskport permissions
        if: runner.os == 'macOS'
        run: |
          echo "1. Read"
          id $(whoami)
          sudo security authorizationdb read system.privilege.taskport

          echo "2. Write"
          sudo security authorizationdb write system.privilege.taskport is-developer

          echo "3. Check"
          sudo security authorizationdb read system.privilege.taskport

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main

      - name: Build distribution
        run: |
          poetry run just build

      - name: Create directories
        run: |
          mkdir -p reports
          mkdir -p .temp
        shell: bash

      - name: Run tests
        run: |
          poetry run just coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: reports/tests.xml

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  stress-test:
    if: github.ref_name != 'main' && !startsWith(github.ref_name, 'release/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main
      - name: Create directories
        run: |
          mkdir -p .temp
        shell: bash
      - name: Run stress-tests for control
        run: |
          poetry run just stress-control
      - name: Run stress-tests
        run: |
          poetry run just stress-threads

  fuzz-test:
    if: github.ref_name != 'main' && !startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: main
      - name: Create directories
        run: |
          mkdir -p .temp
        shell: bash
      # No --count: the seeds are fixed, so repeating a trial re-runs the
      # same trace. Widen coverage by raising TRIALS in the test instead.
      - name: Run fuzz-tests
        run: |
          poetry run just fuzz
