name: CodSpeed

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Skip docs-only PRs. Pushes to main stay unfiltered so every commit
    # refreshes the CodSpeed baseline.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - 'LICENSE'
  # Allow CodSpeed to trigger backtest performance analysis to generate
  # initial baseline data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python-version: "3.15"
          cache-prefix: codspeed

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: poetry run pytest tests/benchmarks -m "benchmark" --codspeed
