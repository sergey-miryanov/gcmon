name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml, CHANGELOG.md]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build + validation only; skip publish and GitHub Release"
        type: boolean
        default: false
      ref:
        description: "Branch or tag to checkout (used for dry runs)"
        type: string
        default: "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  release:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: $/.github/actions/setup
        with:
          python-version: "3.15"
          cache-prefix: release

      - name: Build distribution
        run: poetry run just build

      - name: Validate built distributions
        run: poetry run just check-dist

      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (github.event.inputs.dry_run != 'true')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verify-metadata: true

      - name: Extract changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: poetry run just changelog "$TAG"

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (github.event.inputs.dry_run != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          gh release create "$TAG" \
            --notes "$NOTES" \
            --generate-notes \
            dist/*.whl dist/*.tar.gz
